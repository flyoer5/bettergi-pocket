name: Build APK

on:
  push:
    branches: [ main, root ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main, root ]
  workflow_dispatch:
    inputs:
      rebuild_opencv:
        description: '重新编译裁剪版 OpenCV (core,imgproc,imgcodecs) arm64 并提交'
        type: boolean
        default: false

jobs:
  build-opencv:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rebuild_opencv == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout root
        uses: actions/checkout@v4
        with:
          ref: root

      - name: Install NDK r25c
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"

      - name: Download OpenCV 4.9.0 source
        run: |
          curl -sL -o /tmp/opencv.zip https://github.com/opencv/opencv/archive/refs/tags/4.12.0.zip
          cd /tmp && unzip -q opencv.zip

      - name: Install ant (OpenCV java bindings)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ant

      - name: Configure slim OpenCV (core,imgproc,imgcodecs)  4.12.0
        run: |
          cmake -S /tmp/opencv-4.12.0 -B /tmp/opencv-4.12.0/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_ARM_NEON=ON -DBUILD_LIST=core,imgproc,imgcodecs,java -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_ANDROID_EXAMPLES=OFF -DBUILD_opencv_python3=OFF -DBUILD_opencv_android_sdk=OFF -DWITH_FFMPEG=OFF -DWITH_OPENCL=OFF -DWITH_OPENMP=OFF -DWITH_PROTOBUF=OFF -DWITH_1394=OFF -DWITH_V4L=OFF -DWITH_GSTREAMER=OFF -DWITH_QT=OFF

      - name: Build (native + java jar)
        working-directory: /tmp/opencv-4.12.0/build
        run: make -j4 opencv_java

      - name: Strip & copy slim .so + java jar into repo
        run: |
          STRIP="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          mkdir -p app/src/main/jniLibs/arm64-v8a libs
          for f in $(find /tmp/opencv-4.12.0/build -name 'libopencv_*.so'); do
            "$STRIP" "$f"
            cp "$f" app/src/main/jniLibs/arm64-v8a/
          done
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Commit slim OpenCV
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add app/src/main/jniLibs/arm64-v8a/
          if git diff --cached --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "ci: rebuild slim OpenCV (core,imgproc,imgcodecs) arm64-v8a"
            git push
          fi

  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache enabled)
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bettergi.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/bettergi.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build APK (main=debug, root=release+R8)
        run: |
          if [ "${{ github.ref_name }}" = "root" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'root' && 'bettergi-pocket-root-release-apk' || 'bettergi-pocket-debug-apk' }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
