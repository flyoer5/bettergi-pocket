name: Rust

on:
  push:
    branches: ["**"]
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust/**"
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo clippy (-D warnings)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        run: cargo test --all

  android:
    name: android (aarch64 bgroot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: cargo build (aarch64-linux-android)
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --release -p bg-helper -p bg-jni --target aarch64-linux-android
      - name: strip
        working-directory: .
        run: |
          STRIP="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" -s rust/target/aarch64-linux-android/release/bgroot
          "$STRIP" -s rust/target/aarch64-linux-android/release/libbg_jni.so
      - uses: actions/upload-artifact@v4
        with:
          name: bgroot-aarch64
          path: rust/target/aarch64-linux-android/release/bgroot
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bg-jni-aarch64
          path: rust/target/aarch64-linux-android/release/libbg_jni.so
          if-no-files-found: error

  apk:
    name: apk (rust bgroot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: cargo build (aarch64-linux-android)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --release -p bg-helper -p bg-jni --target aarch64-linux-android
      - name: strip + 替换 assets 里的 helper
        working-directory: .
        run: |
          STRIP="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          "$STRIP" -s rust/target/aarch64-linux-android/release/bgroot
          if ! cmp -s rust/target/aarch64-linux-android/release/bgroot app/src/main/assets/root/arm64-v8a/bgroot; then
            echo "::warning::assets 里的 bgroot 与最新构建不一致；本次 APK 用新构建打包，请把产物提交进仓库"
          fi
          cp rust/target/aarch64-linux-android/release/bgroot app/src/main/assets/root/arm64-v8a/bgroot
          chmod +x app/src/main/assets/root/arm64-v8a/bgroot
          mkdir -p app/src/main/jniLibs/arm64-v8a
          if ! cmp -s rust/target/aarch64-linux-android/release/libbg_jni.so app/src/main/jniLibs/arm64-v8a/libbg_jni.so; then
            echo "::warning::jniLibs 里的 libbg_jni.so 与最新构建不一致；本次 APK 用新构建打包，请把产物提交进仓库"
          fi
          cp rust/target/aarch64-linux-android/release/libbg_jni.so app/src/main/jniLibs/arm64-v8a/libbg_jni.so
          ls -l app/src/main/assets/root/arm64-v8a/bgroot app/src/main/jniLibs/arm64-v8a/libbg_jni.so
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        working-directory: .
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
      - name: Assemble debug APK
        working-directory: .
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bettergi-pocket-debug-rust-helper
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
